# cendre theme for vivid (https://github.com/sharkdp/vivid) · hard
# https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
#
# Install, then export LS_COLORS (read by fd, ls, tree, and anything else
# that honours it):
#   mkdir -p ~/.config/vivid/themes
#   cp /path/to/extras/vivid/cendre.yml ~/.config/vivid/themes/
#   export LS_COLORS="$(vivid generate cendre)"

colors:
  ok: "43b16a"
  error: "d25780"
  frost: "4e89a2"
  hint: "20c9cb"
  brass: "fcba81"
  cinder: "d1766e"

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}
  directory:
    foreground: frost
  sticky:
    foreground: frost
    font-style: bold
  other_writable:
    foreground: frost
    font-style: underline
  sticky_other_writable:
    foreground: frost
    font-style: [bold, underline]
  executable_file:
    foreground: ok
    font-style: bold
  setuid:
    foreground: cinder
    font-style: [bold, underline]
  setgid:
    foreground: cinder
    font-style: [bold, underline]
  symlink:
    foreground: frost
    font-style: italic
  broken_symlink:
    foreground: error
    font-style: italic
  missing_symlink_target:
    foreground: error
    font-style: bold
  multi_hard_link: {}
  fifo:
    foreground: hint
  socket:
    foreground: hint
    font-style: bold
  door:
    foreground: hint
    font-style: bold
  block_device:
    foreground: brass
    font-style: [bold, underline]
  character_device:
    foreground: brass
    font-style: bold
  file_with_capability: {}
text:
  special:
    font-style: bold
  todo:
    font-style: bold
  licenses: {}
  configuration:
    font-style: regular
  other: {}
markup:
  font-style: regular
programming:
  source:
    font-style: regular
  tooling:
    font-style: regular
media:
  font-style: regular
office:
  font-style: regular
archives:
  font-style: regular
executable:
  font-style: regular
  windows:
    foreground: ok
    font-style: bold
unimportant:
  font-style: faint
