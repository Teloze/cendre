# cendre · soft · https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
# source-file ~/.config/tmux/cendre.tmux.conf
# Then set status-left / status-right using the @cendre_status_* module vars.
# Override any @cendre_* option before sourcing; -ogq will not overwrite user values.

set -g status-style "bg=#37312e fg=#e6d5c2"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-interval 10

set -ogq @cendre_window_style "rounded"

%if "#{==:#{@cendre_window_style},rounded}"
set -g window-status-format         "#[fg=#ea9875,bg=#37312e]#[fg=#231f1d,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#443c39] #[fg=#73665b,bg=#443c39] #{window_name} #[fg=#443c39,bg=#37312e]#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#37312e]#[fg=#231f1d,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#554c48] #[fg=#e6d5c2,bg=#554c48,bold] #{window_name} #[fg=#554c48,bg=#37312e]#[none]"
%elif "#{==:#{@cendre_window_style},slanted}"
set -g window-status-format         "#[fg=#ea9875,bg=#37312e]#[fg=#231f1d,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#443c39]#[fg=#73665b,bg=#443c39] #{window_name} #[fg=#443c39,bg=#37312e]█#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#37312e]#[fg=#231f1d,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#554c48]#[fg=#e6d5c2,bg=#554c48,bold] #{window_name} #[fg=#554c48,bg=#37312e]█#[none]"
%elif "#{==:#{@cendre_window_style},powerline}"
set -g window-status-format         "#[fg=#ea9875,bg=#37312e]#[fg=#231f1d,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#443c39]#[fg=#73665b,bg=#443c39] #{window_name} #[fg=#443c39,bg=#37312e]#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#37312e]#[fg=#231f1d,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#554c48]#[fg=#e6d5c2,bg=#554c48,bold] #{window_name} #[fg=#554c48,bg=#37312e]#[none]"
%else
set -g window-status-format         "#[fg=#ea9875,bg=#37312e] #{window_index} #[fg=#73665b,bg=#37312e] #{window_name} #[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#554c48] #{window_index} #[fg=#e6d5c2,bg=#554c48,bold] #{window_name} #[none]"
%endif

# --- Status modules ---
# Compose: set -g status-left "#{E:@cendre_status_session} "
#          set -g status-right " #{E:@cendre_status_branch}"

set -g @cendre_status_session "#[fg=#231f1d,bg=#ea9875,bold] #{session_name} #[fg=#231f1d,bg=#ea9875,bold] #[fg=#ea9875,bg=#37312e]#[none]"

set -ogq @cendre_branch_text "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null)"
set -g  @cendre_status_branch "#[fg=#443c39,bg=#37312e]#[fg=#73665b,bg=#443c39]  #{E:@cendre_branch_text}#[fg=#73665b,bg=#443c39] #[fg=#443c39,bg=#37312e]#[none]"

set -ogq status-left  "#{E:@cendre_status_session} "
set -ogq status-right " #{E:@cendre_status_branch}"

set -g window-status-last-style "fg=#a09384"
set -g window-status-activity-style "fg=#f4a21c"

set -g pane-border-style "fg=#443c39"
set -g pane-active-border-style "fg=#ea9875"

set -g message-style "bg=#37312e fg=#e6d5c2"
set -g message-command-style "bg=#37312e fg=#e6d5c2"

set -g mode-style "bg=#3d2b23 fg=#e6d5c2"
