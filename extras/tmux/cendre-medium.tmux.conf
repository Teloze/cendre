# cendre · medium · https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
# source-file ~/.config/tmux/cendre.tmux.conf
# Then set status-left / status-right using the @cendre_status_* module vars.
# Override any @cendre_* option before sourcing; -ogq will not overwrite user values.

set -g status-style "bg=#312a28 fg=#e6d5c2"
set -gq prompt-cursor-colour "#ea9875"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-interval 10

set -ogq @cendre_window_style "rounded"

%if "#{==:#{@cendre_window_style},rounded}"
set -g window-status-format         "#[fg=#ea9875,bg=#312a28]#[fg=#1d1917,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#3d3633] #[fg=#73665b,bg=#3d3633] #{window_name} #[fg=#3d3633,bg=#312a28]#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#312a28]#[fg=#1d1917,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#4e4541] #[fg=#e6d5c2,bg=#4e4541,bold] #{window_name} #[fg=#4e4541,bg=#312a28]#[none]"
%elif "#{==:#{@cendre_window_style},slanted}"
set -g window-status-format         "#[fg=#ea9875,bg=#312a28]#[fg=#1d1917,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#3d3633]#[fg=#73665b,bg=#3d3633] #{window_name} #[fg=#3d3633,bg=#312a28]█#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#312a28]#[fg=#1d1917,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#4e4541]#[fg=#e6d5c2,bg=#4e4541,bold] #{window_name} #[fg=#4e4541,bg=#312a28]█#[none]"
%elif "#{==:#{@cendre_window_style},powerline}"
set -g window-status-format         "#[fg=#ea9875,bg=#312a28]#[fg=#1d1917,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#3d3633]#[fg=#73665b,bg=#3d3633] #{window_name} #[fg=#3d3633,bg=#312a28]#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#312a28]#[fg=#1d1917,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#4e4541]#[fg=#e6d5c2,bg=#4e4541,bold] #{window_name} #[fg=#4e4541,bg=#312a28]#[none]"
%else
set -g window-status-format         "#[fg=#ea9875,bg=#312a28] #{window_index} #[fg=#73665b,bg=#312a28] #{window_name} #[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#4e4541] #{window_index} #[fg=#e6d5c2,bg=#4e4541,bold] #{window_name} #[none]"
%endif

# --- Status modules ---
# Compose: set -g status-left "#{E:@cendre_status_session} "
#          set -g status-right " #{E:@cendre_status_gitmux}"

set -g @cendre_status_session "#[fg=#1d1917,bg=#ea9875,bold] #{session_name} #[fg=#1d1917,bg=#ea9875,bold] #[fg=#ea9875,bg=#312a28]#[none]"

set -ogq @cendre_branch_text "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null)"
set -g  @cendre_status_branch "#[fg=#3d3633,bg=#312a28]#[fg=#73665b,bg=#3d3633]  #{E:@cendre_branch_text}#[fg=#73665b,bg=#3d3633] #[fg=#3d3633,bg=#312a28]#[none]"

set -ogq @cendre_gitmux_text '#(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}")'
set -g  @cendre_status_gitmux "#[fg=#3d3633,bg=#312a28]#[fg=#73665b,bg=#3d3633]  #{E:@cendre_gitmux_text}#[fg=#73665b,bg=#3d3633] #[none]"

set -ogq status-left  "#{E:@cendre_status_session} "
set -ogq status-right " #{E:@cendre_status_gitmux}"

# --- Gitmux palette (referenced as #{@cendre_gitmux_*} in .gitmux.conf styles) ---
# Undefine these vars to remove cendre's influence on gitmux colors.
set -g @cendre_gitmux_fg     "#e6d5c2"
set -g @cendre_gitmux_dim    "#a09384"
set -g @cendre_gitmux_accent "#ea9875"
set -g @cendre_gitmux_ok     "#43b16a"
set -g @cendre_gitmux_warn   "#f4a21c"
set -g @cendre_gitmux_error  "#d25780"

set -g window-status-last-style "fg=#a09384"
set -g window-status-activity-style "fg=#f4a21c"

set -g pane-border-style "fg=#3d3633"
set -g pane-active-border-style "fg=#ea9875"

set -g message-style "bg=#312a28 fg=#e6d5c2"
set -g message-command-style "bg=#312a28 fg=#e6d5c2"

set -g mode-style "bg=#36241d fg=#e6d5c2"
