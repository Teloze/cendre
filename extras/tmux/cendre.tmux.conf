# cendre · hard · https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
# source-file ~/.config/tmux/cendre.tmux.conf
# Then set status-left / status-right using the @cendre_status_* module vars.
# Override any @cendre_* option before sourcing; -ogq will not overwrite user values.

set -g status-style "bg=#2a2422 fg=#e6d5c2"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-interval 10

set -ogq @cendre_window_style "rounded"

%if "#{==:#{@cendre_window_style},rounded}"
set -g window-status-format         "#[fg=#ea9875,bg=#2a2422]#[fg=#171311,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#362f2c] #[fg=#73665b,bg=#362f2c] #{window_name} #[fg=#362f2c,bg=#2a2422]#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#2a2422]#[fg=#171311,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#463e3a] #[fg=#e6d5c2,bg=#463e3a,bold] #{window_name} #[fg=#463e3a,bg=#2a2422]#[none]"
%elif "#{==:#{@cendre_window_style},slanted}"
set -g window-status-format         "#[fg=#ea9875,bg=#2a2422]#[fg=#171311,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#362f2c]#[fg=#73665b,bg=#362f2c] #{window_name} #[fg=#362f2c,bg=#2a2422]█#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#2a2422]#[fg=#171311,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#463e3a]#[fg=#e6d5c2,bg=#463e3a,bold] #{window_name} #[fg=#463e3a,bg=#2a2422]█#[none]"
%elif "#{==:#{@cendre_window_style},powerline}"
set -g window-status-format         "#[fg=#ea9875,bg=#2a2422]#[fg=#171311,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#362f2c]#[fg=#73665b,bg=#362f2c] #{window_name} #[fg=#362f2c,bg=#2a2422]#[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#2a2422]#[fg=#171311,bg=#ea9875]#{window_index} #[fg=#ea9875,bg=#463e3a]#[fg=#e6d5c2,bg=#463e3a,bold] #{window_name} #[fg=#463e3a,bg=#2a2422]#[none]"
%else
set -g window-status-format         "#[fg=#ea9875,bg=#2a2422] #{window_index} #[fg=#73665b,bg=#2a2422] #{window_name} #[none]"
set -g window-status-current-format "#[fg=#ea9875,bg=#463e3a] #{window_index} #[fg=#e6d5c2,bg=#463e3a,bold] #{window_name} #[none]"
%endif

# --- Status modules ---
# Compose: set -g status-left "#{E:@cendre_status_session} "
#          set -g status-right " #{E:@cendre_status_branch}"

set -g @cendre_status_session "#[fg=#171311,bg=#ea9875,bold] #{session_name} #[fg=#171311,bg=#ea9875,bold] #[fg=#ea9875,bg=#2a2422]#[none]"

set -ogq @cendre_branch_text "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null)"
set -g  @cendre_status_branch "#[fg=#362f2c,bg=#2a2422]#[fg=#73665b,bg=#362f2c]  #{E:@cendre_branch_text}#[fg=#73665b,bg=#362f2c] #[fg=#362f2c,bg=#2a2422]#[none]"

set -ogq status-left  "#{E:@cendre_status_session} "
set -ogq status-right " #{E:@cendre_status_branch}"

set -g window-status-last-style "fg=#a09384"
set -g window-status-activity-style "fg=#f4a21c"

set -g pane-border-style "fg=#362f2c"
set -g pane-active-border-style "fg=#ea9875"

set -g message-style "bg=#2a2422 fg=#e6d5c2"
set -g message-command-style "bg=#2a2422 fg=#e6d5c2"

set -g mode-style "bg=#2f1e17 fg=#e6d5c2"
